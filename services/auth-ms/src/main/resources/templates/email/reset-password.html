<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #4a6ea9;
            padding: 20px;
            text-align: center;
            color: white;
        }
        .content {
            padding: 30px;
            line-height: 1.5;
            color: #333;
        }
        .button {
            display: inline-block;
            background-color: #4a6ea9;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            margin: 20px 0;
            font-weight: bold;
        }
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
        }
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
                margin: 0 !important;
            }
            .content {
                padding: 20px !important;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Восстановление пароля</h2>
    </div>
    <div class="content">
        <p>Здравствуйте!</p>
        <p>Вы запросили сброс пароля для вашей учётной записи. Чтобы установить новый пароль, нажмите на кнопку ниже:</p>
        <p style="text-align: center;">
            <a href="{{linkWithToken}}" class="button" style="color: white; background-color: #4a6ea9;">Сбросить пароль</a>
        </p>
        <p>Ссылка действительна <strong>15 минут</strong>.</p>
        <p>Если вы не запрашивали сброс, просто проигнорируйте это письмо.</p>
    </div>
    <div class="footer">
        &copy; Digital-Hustle
    </div>
</div>
</body>
</html>
